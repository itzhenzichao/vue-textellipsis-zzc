<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>vue-textellipsis-zzc</title>
    <script>
      // GitHub Pages SPA trick: redirect 404 to index.html with query param
      var pathSegments = window.location.pathname.slice(1).split('/');
      var redirectPath = '/'+ pathSegments.join('/') + '?redirect=' + encodeURIComponent(window.location.pathname);
      if (window.location.search.indexOf('redirect=') === -1) {
        window.location.replace(redirectPath);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Restore the original URL from redirect param
      var redirect = new URLSearchParams(window.location.search).get('redirect');
      if (redirect) {
        var url = new URL(window.location.origin + redirect);
        window.history.replaceState(null, null, url.pathname);
      }
    </script>
  </body>
</html>
